apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zorin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vishnuvardhan1170/test.git
    targetRevision: main
    path: helm
    helm:
      releaseName: zorin
      values: |
        namespace: zorin
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zorin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 10
