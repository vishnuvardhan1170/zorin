name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - "helm/**"
      - "templates/**"
      - ".github/workflows/ci-cd.yaml"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "xxxxxxxxxxxx"
  ECR_REPOSITORY: "zorin"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push"  #OIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update image tag in Helm values.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "zorin"
          git config user.email "zorin@noreply.gmail.com"

          sed -i "s|repository: .*|repository: ${ECR_REGISTRY}/${ECR_REPOSITORY}|g" helm/values.yaml
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|g" helm/values.yaml

          git add helm/values.yaml
          git commit -m "chore: update image to ${{ github.sha }} [skip lint]" || echo "No changes"
          git push
